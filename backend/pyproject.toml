[project]
name = "mcw"
version = "0.1.0"
description = "Maritime Campaign Workbench API: synthetic campaign planning over Postgres, MinIO, OpenSearch and Fuseki"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "httpx>=0.27",
    "rdflib>=7.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mcw-fixture-check = "mcw.fixture_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres, MinIO, OpenSearch and Fuseki"]
